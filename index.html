<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIAL. - Idea to Real</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Inter',sans-serif;}
  nav{display:flex;justify-content:space-between;padding:30px 6%;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0a0a0a;z-index:10}
  .logo{font-family:'Space Grotesk',sans-serif;letter-spacing:5px;font-weight:700;font-size:22px}
  .nav-links{font-size:12px;letter-spacing:2px;color:#888;display:flex;gap:20px}
  .hero{padding:60px 6% 30px 6%;}
  .hero h1{font-family:'Space Grotesk',sans-serif;font-size: clamp(32px, 8vw, 64px);line-height:1.1;max-width:600px;font-weight:700}
  .container{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 6% 80px 6%;}
  @media(max-width:768px){.container{grid-template-columns:1fr}}
  .card{border:1px solid #222;padding:35px;min-height:480px;display:flex;flex-direction:column;transition:0.3s;background:#11111108}
  .card:hover{border-color:#444;background:#111}
  .num{color:#333;font-size:14px;letter-spacing:2px;margin-bottom:50px;font-family:'Space Grotesk'}
  .card h2{font-family:'Space Grotesk';font-size:32px;margin-bottom:15px;letter-spacing:1px}
  .card p{color:#666;font-size:14px;line-height:1.6;margin-bottom:25px}
  input, textarea{width:100%;background:#0a0a0a;border:1px solid #222;color:#fff;padding:14px;margin-bottom:12px;font-family:'Inter';font-size:14px;outline:none;transition:0.2s}
  input:focus, textarea:focus{border-color:#555}
  textarea{height:100px;resize:none}
  button{background:#fff;color:#000;border:none;padding:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:0.2s;font-family:'Space Grotesk';margin-top:auto}
  button:hover{background:#ddd;transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:#fff;border:1px solid #333}
  .btn-ghost:hover{background:#fff;color:#000}
  .list{margin-top:20px;border-top:1px solid #1a1a1a;padding-top:15px;max-height:200px;overflow-y:auto}
  .list-item{background:#0a0a0a;border:1px solid #1a1a1a;padding:12px;margin-bottom:8px;font-size:13px;color:#aaa}
  .list-item strong{color:#fff;display:block;margin-bottom:4px}
  footer{border-top:1px solid #1a1a1a;padding:25px 6%;color:#444;font-size:11px;letter-spacing:2px;display:flex;justify-content:space-between}
</style>
</head>
<body>

<nav>
  <div class="logo">TRIAL.</div>
  <div class="nav-links"><span>ABOUT</span><span>PROCESS</span></div>
</nav>

<div class="hero">
  <h1>From an idea to something real.</h1>
</div>

<div class="container">
  <!-- 01 IDEA BOX -->
  <div class="card">
    <div class="num">01</div>
    <h2>IDEA</h2>
    <p>Have an idea? Drop it here. Every great project starts with a simple thought.</p>
    
    <input type="text" id="ideaName" placeholder="Your Name">
    <textarea id="ideaText" placeholder="Write your idea here..."></textarea>
    <button onclick="submitIdea()">SUBMIT IDEA →</button>

    <div class="list" id="ideaList"></div>
  </div>

  <!-- 02 ISSUE BOX -->
  <div class="card">
    <div class="num">02</div>
    <h2>FIX IT</h2>
    <p>Found a bug or something broken? Tell us what went wrong.</p>
    
    <input type="text" id="issueName" placeholder="Your Name">
    <textarea id="issueText" placeholder="What went wrong?"></textarea>
    <button class="btn-ghost" onclick="submitIssue()">REPORT ISSUE →</button>

    <div class="list" id="issueList"></div>
  </div>
</div>

<footer>
  <span>© 2026 TRIAL.</span>
  <span>BUILT WITH COURAGE</span>
</footer>

<script>
  // Load old data
  let ideas = JSON.parse(localStorage.getItem('trial_ideas') || '[]');
  let issues = JSON.parse(localStorage.getItem('trial_issues') || '[]');
  
  function render(){
    document.getElementById('ideaList').innerHTML = ideas.map(i => 
      `<div class="list-item"><strong>${i.name}</strong>${i.text}</div>`
    ).join('');
    document.getElementById('issueList').innerHTML = issues.map(i => 
      `<div class="list-item"><strong>${i.name} - BUG</strong>${i.text}</div>`
    ).join('');
  }
  render();

  function submitIdea(){
    const name = document.getElementById('ideaName').value || 'Anonymous';
    const text = document.getElementById('ideaText').value;
    if(!text) return alert('Please write an idea!');
    ideas.unshift({name, text});
    localStorage.setItem('trial_ideas', JSON.stringify(ideas));
    document.getElementById('ideaText').value='';
    render();
  }

  function submitIssue(){
    const name = document.getElementById('issueName').value || 'Anonymous';
    const text = document.getElementById('issueText').value;
    if(!text) return alert('Please describe the issue!');
    issues.unshift({name, text});
    localStorage.setItem('trial_issues', JSON.stringify(issues));
    document.getElementById('issueText').value='';
    render();
  }
</script>

</body>
</html>
